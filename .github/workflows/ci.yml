name: RAG KB Catalog Service CI/CD Pipeline

on:
  push:
    branches:
      - main
      - rag-kb-catalog-service
  pull_request:
    branches:
      - main
      - rag-kb-catalog-service
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  SERVICE_NAME: "rag-kb-catalog-service"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & Typecheck (Go 1.23+, gofmt, go vet, golangci-lint)
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Verify Go Formatting (gofmt)
        run: |
          if [ -f "go.mod" ]; then
            UNFORMATTED=$(gofmt -s -l .)
            if [ -n "$UNFORMATTED" ]; then
              echo "The following Go files are not formatted with gofmt -s:"
              echo "$UNFORMATTED"
              exit 1
            fi
          else
            echo "No go.mod present yet (scaffolding phase); skipping gofmt."
          fi

      - name: Run Static Type & Vet Analysis (go vet)
        run: |
          if [ -f "go.mod" ]; then
            go vet ./...
          else
            echo "No go.mod present yet (scaffolding phase); skipping go vet."
          fi

      - name: Run golangci-lint
        if: hashFiles('go.mod') != ''
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

      - name: Verify Hexagonal Domain Isolation (Zero Third-Party I/O in internal/domain)
        run: |
          if [ -d "internal/domain" ]; then
            echo "Auditing internal/domain for forbidden infrastructure imports..."
            if grep -rnE 'github\.com/jackc/pgx|github\.com/redis/go-redis|go\.temporal\.io|google\.golang\.org/grpc|net/http' internal/domain/; then
              echo "::error::Domain layer isolation violated: internal/domain must not import third-party I/O or transport packages."
              exit 1
            fi
            echo "Domain isolation verified cleanly."
          fi

  # ---------------------------------------------------------------------------
  # 2. Security & Secured Logging Audit
  # ---------------------------------------------------------------------------
  security-and-logging-audit:
    name: Security & Secured Logging Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify .gitignore Excludes tasks/ and Secrets
        run: |
          if ! grep -qE '^tasks/?$' .gitignore; then
            echo "::error::.gitignore must explicitly exclude the tasks/ reference directory."
            exit 1
          fi
          if git ls-files --error-unmatch tasks/ >/dev/null 2>&1; then
            echo "::error::Files inside tasks/ must not be tracked by Git."
            exit 1
          fi
          echo ".gitignore rules verified."

      - name: Audit Secured Logging Invariants (Structured slog JSON & Redaction)
        run: |
          echo "Auditing codebase for unstructured logging and sensitive credential leaks..."
          if [ -d "cmd" ] || [ -d "internal" ]; then
            # 1. Forbid raw fmt.Print* or standard log.Print* in production packages (excluding tests)
            RAW_LOGS=$(find cmd internal -type f -name "*.go" ! -name "*_test.go" -exec grep -HnE '\b(fmt\.Print|fmt\.Println|fmt\.Printf|log\.Print|log\.Println|log\.Printf|log\.Fatal|log\.Fatalf)\b' {} + || true)
            if [ -n "$RAW_LOGS" ]; then
              echo "::error::Unstructured logging detected! Use log/slog with structured JSON handler instead:"
              echo "$RAW_LOGS"
              exit 1
            fi

            # 2. Forbid logging raw JWT tokens, Authorization headers, DB DSNs, or Redis passwords
            SENSITIVE_LOGS=$(find cmd internal -type f -name "*.go" ! -name "*_test.go" -exec grep -HnEi 'slog\.(Info|Debug|Warn|Error).*(Authorization|Bearer|jwt_token|raw_token|password|secret|dsn)' {} + | grep -v "REDACTED" || true)
            if [ -n "$SENSITIVE_LOGS" ]; then
              echo "::error::Potential sensitive credential or raw token logged without redaction:"
              echo "$SENSITIVE_LOGS"
              exit 1
            fi
          fi
          echo "Secured logging audit passed."

      - name: Audit PgBouncer Transaction Mode Compatibility (exec mode)
        run: |
          if [ -d "internal/infrastructure/persistence/postgres" ]; then
            echo "Checking pgx pool configuration for PgBouncer compatibility (QueryExecModeExec)..."
            if find internal/infrastructure/persistence/postgres -name "*.go" | grep -q .; then
              if ! grep -rnE 'QueryExecModeExec|default_query_exec_mode=exec' internal/infrastructure/persistence/postgres/; then
                echo "::error::PostgreSQL pool must enforce default_query_exec_mode = exec (pgx.QueryExecModeExec) for PgBouncer compatibility."
                exit 1
              fi
            fi
          fi

      - name: Run Go Vulnerability Check (govulncheck)
        if: hashFiles('go.mod') != ''
        uses: golang/govulncheck-action@v1
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-input: ${{ env.GO_VERSION }}

  # ---------------------------------------------------------------------------
  # 3. OpenAPI 3.1 & Doc API Contract Sync
  # ---------------------------------------------------------------------------
  openapi-and-doc-api-sync:
    name: OpenAPI 3.1 & Doc API Contract Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Core AI Context & Documentation Existence
        run: |
          REQUIRED_FILES=(
            "GEMINI.MD"
            ".ai.md"
            ".ai/project-overview.md"
            ".ai/architecture.md"
            ".ai/doc-api.md"
            ".ai/code-standards.md"
            ".ai/security.md"
            ".ai/ai-workflow-rules.md"
            ".ai/agents.md"
            ".ai/progress-tracker.md"
            "api/openapi/openapi.yaml"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required documentation, OpenAPI 3.1 spec, or AI context file: $file"
              exit 1
            fi
          done
          echo "All required .ai context files, GEMINI.MD, and api/openapi/openapi.yaml are present."

      - name: Validate Doc API & OpenAPI 3.1 Contract Specification
        run: |
          echo "Validating .ai/doc-api.md for mandatory OpenAPI 3.1 and gRPC contracts..."
          grep -q "3.1.0" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must specify OpenAPI 3.1.0 schema"; exit 1; }
          grep -q "/healthz" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document /healthz liveness probe"; exit 1; }
          grep -q "/ready" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document /ready readiness probe"; exit 1; }
          grep -q "/docs" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document /docs Swagger UI endpoint"; exit 1; }
          grep -q "/openapi.json" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document /openapi.json endpoint"; exit 1; }
          grep -q "CreateKnowledgeBase" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document CreateKnowledgeBase RPC"; exit 1; }
          grep -q "TriggerReindexing" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document TriggerReindexing RPC"; exit 1; }
          grep -q "PromoteIndexPointer" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document PromoteIndexPointer RPC"; exit 1; }
          grep -q "AbortReindexing" .ai/doc-api.md || { echo "::error::.ai/doc-api.md must document AbortReindexing RPC"; exit 1; }

          echo "Validating api/openapi/openapi.yaml..."
          python3 -c '
          import sys, yaml
          with open("api/openapi/openapi.yaml", "r", encoding="utf-8") as f:
              spec = yaml.safe_load(f)
          assert str(spec.get("openapi", "")).startswith("3.1"), "OpenAPI version must be 3.1.x"
          paths = spec.get("paths", {})
          assert "/healthz" in paths, "Missing /healthz in openapi.yaml"
          assert "/ready" in paths, "Missing /ready in openapi.yaml"
          assert "/v1/knowledge-bases" in paths, "Missing /v1/knowledge-bases in openapi.yaml"
          assert "/v1/knowledge-bases/{kb_id}" in paths, "Missing /v1/knowledge-bases/{kb_id} in openapi.yaml"
          components = spec.get("components", {})
          assert "bearerAuth" in components.get("securitySchemes", {}), "Missing bearerAuth securityScheme in openapi.yaml"
          assert "KnowledgeBase" in components.get("schemas", {}), "Missing KnowledgeBase schema in openapi.yaml"
          print("api/openapi/openapi.yaml is valid OpenAPI 3.1!")
          '

      - name: Enforce Continuous Doc API Synchronization on Code Modifications
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          CHANGED_CODE=$(git diff --name-only "$MERGE_BASE...HEAD" -- 'cmd/**' 'internal/**' 'api/proto/**')
          CHANGED_DOC_API=$(git diff --name-only "$MERGE_BASE...HEAD" -- '.ai/doc-api.md')
          CHANGED_OPENAPI=$(git diff --name-only "$MERGE_BASE...HEAD" -- 'api/openapi/openapi.yaml')
          if [ -n "$CHANGED_CODE" ]; then
            if [ -z "$CHANGED_DOC_API" ] || [ -z "$CHANGED_OPENAPI" ]; then
              echo "::error::Code or Protobuf contracts were modified without updating BOTH .ai/doc-api.md and api/openapi/openapi.yaml."
              exit 1
            fi
          fi

  # ---------------------------------------------------------------------------
  # 4. Test Suites (Unit, Integration, Chaos & Race Detector)
  # ---------------------------------------------------------------------------
  test-suites:
    name: Test Suites (Unit, Integration & Chaos)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run Unit Test Suite (Schema Immutability, State Machine, Taxonomy)
        run: |
          if [ -f "go.mod" ]; then
            echo "Running unit tests with race detector enabled..."
            if [ -d "test/unit" ]; then
              go test -v -race -coverprofile=coverage-unit.out ./internal/... ./test/unit/...
            else
              go test -v -race -coverprofile=coverage-unit.out ./...
            fi
          else
            echo "No go.mod present yet (scaffolding phase); skipping unit tests."
          fi

      - name: Run Integration Test Suite (OCC Conflict, Outbox Atomicity, Redis Key Coherence)
        run: |
          if [ -f "go.mod" ] && [ -d "test/integration" ]; then
            echo "Running integration tests with race detector..."
            go test -v -race ./test/integration/...
          else
            echo "Integration test directory not populated yet; skipping."
          fi

      - name: Run Chaos & Rollback Test Suite (Delta Lag Gating & Failed Backfill Rollback)
        run: |
          if [ -f "go.mod" ] && [ -d "test/chaos" ]; then
            echo "Running chaos & migration rollback tests..."
            go test -v -race ./test/chaos/...
          else
            echo "Chaos test directory not populated yet; skipping."
          fi

      - name: Run Synthetic Load & Benchmark Suite
        run: |
          if [ -f "go.mod" ] && [ -d "test/benchmark" ]; then
            echo "Running load benchmarks and quantile SLI tests..."
            go test -v -run=^TestLoad ./test/benchmark/...
            go test -v -bench=. -run=^Benchmark ./test/benchmark/...
          else
            echo "Benchmark directory not populated yet; skipping."
          fi

  # ---------------------------------------------------------------------------
  # 5. Production Packaging, Docker & Helm Validation
  # ---------------------------------------------------------------------------
  packaging-and-helm-validation:
    name: Packaging, Docker & Helm Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: Lint Helm Chart
        run: |
          if [ -d "deployments/helm/rag-kb-catalog-service" ]; then
            echo "Linting Helm chart..."
            helm lint deployments/helm/rag-kb-catalog-service
          fi

      - name: Verify ArgoCD Manifest Syntactic Validity
        run: |
          if [ -f "deployments/argocd/application.yaml" ]; then
            python3 -c '
            import yaml
            with open("deployments/argocd/application.yaml") as f:
                app = yaml.safe_load(f)
            assert app.get("kind") == "Application"
            assert app.get("apiVersion") == "argoproj.io/v1alpha1"
            print("ArgoCD Application manifest is valid YAML!")
            '
          fi

      - name: Verify Debezium Connector Configuration Syntactic Validity
        run: |
          if [ -f "deployments/debezium/register-postgres-outbox-connector.json" ]; then
            python3 -c '
            import json
            with open("deployments/debezium/register-postgres-outbox-connector.json") as f:
                cfg = json.load(f)
            assert cfg.get("name") == "rag-kb-catalog-outbox-connector"
            assert "config" in cfg
            print("Debezium connector JSON is valid!")
            '
          fi

      - name: Validate Helm Template with Injected Secrets
        env:
          JWT_HMAC_SECRET: ${{ secrets.JWT_HMAC_SECRET || 'ci-test-mock-jwt-secret-at-least-32-bytes-long' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci-test-postgres-password' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || 'ci-test-redis-password' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://ci_usr:ci_pwd@ci-db.example.com:5432/ci_db?sslmode=require' }}
        run: |
          echo "Testing Helm chart rendering with injected secrets..."
          helm template test-release deployments/helm/rag-kb-catalog-service \
            --set secrets.jwtHmacSecret="${JWT_HMAC_SECRET}" \
            --set secrets.postgresPassword="${POSTGRES_PASSWORD}" \
            --set secrets.redisPassword="${REDIS_PASSWORD}" \
            --set secrets.databaseUrl="${DATABASE_URL}" \
            > rendered-manifests.yaml

          grep -q "kind: Secret" rendered-manifests.yaml || { echo "::error::Rendered manifests missing Secret resource"; exit 1; }
          grep -q "POSTGRES_PASSWORD:" rendered-manifests.yaml || { echo "::error::Rendered Secret missing POSTGRES_PASSWORD"; exit 1; }
          grep -q "REDIS_PASSWORD:" rendered-manifests.yaml || { echo "::error::Rendered Secret missing REDIS_PASSWORD"; exit 1; }
          grep -q "JWT_HMAC_SECRET:" rendered-manifests.yaml || { echo "::error::Rendered Secret missing JWT_HMAC_SECRET"; exit 1; }
          grep -q "DATABASE_URL:" rendered-manifests.yaml || { echo "::error::Rendered Secret missing DATABASE_URL"; exit 1; }
          rm -f rendered-manifests.yaml
          echo "Helm secret injection template verification passed cleanly."

      - name: Verify Distroless Docker Build
        run: |
          if [ -f "deployments/docker/Dockerfile" ]; then
            echo "Building Docker container image..."
            docker build -f deployments/docker/Dockerfile -t rag-kb-catalog-service:ci .
          fi

  # ---------------------------------------------------------------------------
  # 6. CI/CD Secret Injection & Cluster Deployment Verification
  # ---------------------------------------------------------------------------
  cd-secret-injection-and-deployment:
    name: CI/CD Secret Injection & Cluster Deployment Verification
    needs: [lint-and-typecheck, security-and-logging-audit, openapi-and-doc-api-sync, test-suites, packaging-and-helm-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rag-kb-catalog-service' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Helm & Kubectl
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: Execute Secret Masking and Injection Validation
        env:
          JWT_HMAC_SECRET: ${{ secrets.JWT_HMAC_SECRET || 'ci-default-jwt-secret-min-32-chars-mock' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci-default-postgres-password' }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD || 'ci-default-redis-password' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Enforce GitHub Actions runner log masking for all injected credentials
          echo "::add-mask::$JWT_HMAC_SECRET"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$REDIS_PASSWORD"
          if [ -n "$DATABASE_URL" ]; then echo "::add-mask::$DATABASE_URL"; fi

          echo "Injecting GitHub Secrets into Kubernetes Secret manifest..."
          EXTRA_ARGS=""
          if [ -n "$DATABASE_URL" ]; then
            EXTRA_ARGS="--set secrets.databaseUrl=$DATABASE_URL"
          fi

          helm template rag-kb-catalog-service deployments/helm/rag-kb-catalog-service \
            --namespace rag-system \
            --set secrets.jwtHmacSecret="$JWT_HMAC_SECRET" \
            --set secrets.postgresPassword="$POSTGRES_PASSWORD" \
            --set secrets.redisPassword="$REDIS_PASSWORD" \
            $EXTRA_ARGS \
            --show-only templates/secret.yaml > /tmp/injected-secret.yaml

          # Verify secret contains required opaque type and keys
          grep -q "type: Opaque" /tmp/injected-secret.yaml || { echo "::error::Injected secret is not type: Opaque"; exit 1; }
          grep -q "POSTGRES_PASSWORD:" /tmp/injected-secret.yaml || { echo "::error::Injected secret missing POSTGRES_PASSWORD"; exit 1; }
          grep -q "REDIS_PASSWORD:" /tmp/injected-secret.yaml || { echo "::error::Injected secret missing REDIS_PASSWORD"; exit 1; }
          grep -q "JWT_HMAC_SECRET:" /tmp/injected-secret.yaml || { echo "::error::Injected secret missing JWT_HMAC_SECRET"; exit 1; }

          rm -f /tmp/injected-secret.yaml
          echo "Secret injection validation succeeded."

      - name: Deploy Injected Secret to Kubernetes Cluster (When KUBECONFIG is configured)
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          JWT_HMAC_SECRET: ${{ secrets.JWT_HMAC_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$KUBECONFIG_DATA" ] && [ -n "$JWT_HMAC_SECRET" ]; then
            echo "KUBECONFIG and secrets detected; injecting directly to Kubernetes cluster..."
            mkdir -p ~/.kube
            echo "$KUBECONFIG_DATA" | base64 -d > ~/.kube/config
            kubectl create namespace rag-system --dry-run=client -o yaml | kubectl apply -f -
            
            EXTRA_LITERALS=""
            if [ -n "$DATABASE_URL" ]; then
              EXTRA_LITERALS="--from-literal=DATABASE_URL=$DATABASE_URL"
            fi

            kubectl create secret generic rag-kb-catalog-service-secret \
              --namespace rag-system \
              --from-literal=JWT_HMAC_SECRET="$JWT_HMAC_SECRET" \
              --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
              --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
              $EXTRA_LITERALS \
              --dry-run=client -o yaml | kubectl apply -f -
            rm -rf ~/.kube
            echo "Kubernetes Secret successfully injected and synced in namespace rag-system."
          else
            echo "No live KUBECONFIG secret provided in CI environment; skipped direct cluster push (ArgoCD / GitOps mode)."
          fi



