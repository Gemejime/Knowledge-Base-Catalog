# ==============================================================================
# Local Development Environment (PostgreSQL 16 + Redis)
# RAG Knowledge Base Catalog Service
#
# Usage:
#   docker compose -f deployments/docker/docker-compose.dev.yml up -d
#   docker compose -f deployments/docker/docker-compose.dev.yml down
# ==============================================================================

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-catalog-postgres-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=rag_catalog_user
      - POSTGRES_PASSWORD=change-me-postgres-password
      - POSTGRES_DB=rag_catalog
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_catalog_user -d rag_catalog"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: bitnami/redis:7.2-debian-12
    container_name: rag-catalog-redis-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=change-me-redis-password
      - REDIS_AOF_ENABLED=yes
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PORT_NUMBER=6379
    volumes:
      - redis_local_data:/bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "change-me-redis-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_local_data:
    driver: local
  redis_local_data:
    driver: local
