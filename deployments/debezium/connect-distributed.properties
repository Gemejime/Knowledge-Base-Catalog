# Kafka Connect Worker Distributed Properties
# Configured for Debezium PostgreSQL CDC Outbox Connector

bootstrap.servers=kafka:9092
group.id=rag-kb-catalog-connect-cluster

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=false

offset.storage.topic=rag_catalog_connect_offsets
offset.storage.replication.factor=3
config.storage.topic=rag_catalog_connect_configs
config.storage.replication.factor=3
status.storage.topic=rag_catalog_connect_status
status.storage.replication.factor=3

# Config Providers: Environment Variable Provider for ${envVarProvider:ENV_VAR}
config.providers=envVarProvider
config.providers.envVarProvider.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

