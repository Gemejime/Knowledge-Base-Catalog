apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-kb-catalog-service.fullname" . }}
  labels:
    {{- include "rag-kb-catalog-service.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.ports.grpc }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "rag-kb-catalog-service.selectorLabels" . | nindent 4 }}

