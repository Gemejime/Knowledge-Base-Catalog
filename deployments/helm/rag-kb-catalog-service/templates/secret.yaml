apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-kb-catalog-service.fullname" . }}-secret
  labels:
    {{- include "rag-kb-catalog-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_HMAC_SECRET: {{ .Values.secrets.jwtHmacSecret | quote }}

