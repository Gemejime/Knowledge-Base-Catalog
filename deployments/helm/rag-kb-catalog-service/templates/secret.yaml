{{- $jwtSecret := .Values.secrets.jwtHmacSecret | default "" -}}
{{- if and (ne .Release.Name "release-name") (or (empty $jwtSecret) (lt (len $jwtSecret) 32)) -}}
{{- fail "secrets.jwtHmacSecret must be configured with a unique string of at least 32 bytes (256 bits)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-kb-catalog-service.fullname" . }}-secret
  labels:
    {{- include "rag-kb-catalog-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  JWT_HMAC_SECRET: {{ $jwtSecret | quote }}

