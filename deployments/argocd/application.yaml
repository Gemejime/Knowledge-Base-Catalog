apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-kb-catalog-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: rag-kb-catalog-service
    app.kubernetes.io/part-of: rag-system
spec:
  project: default
  source:
    repoURL: https://github.com/gemejime/rag-kb-catalog-service.git
    targetRevision: HEAD
    path: deployments/helm/rag-kb-catalog-service
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rag-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

